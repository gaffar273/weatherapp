<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
  
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="https://cdn-icons-png.flaticon.com/512/622/622669.png"> </button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img src="https://img.icons8.com/?size=100&id=bFjyGgCI62A8&format=png&color=000000" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New Work</h2>
            <div class="details">
                <div class="col">
                    <img src="https://img.icons8.com/?size=100&id=5cvpgkIOetHv&format=png&color=000000" >
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="https://img.icons8.com/?size=100&id=OKUKee5V1Zs5&format=png&color=000000" >
                    <div>
                        <p class="wind">20 KMPH</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
  <script>
    const apiKey="906a7b0889ce4df13bb3012d10c67afa"
const apiUrl="https://api.openweathermap.org/data/2.5/weather?q="
const searchBox=document.querySelector(".search input");
const searchBtn=document.querySelector(".search button");
const weatherIcon=document.querySelector(".weather-icon")

async function cheakWeather(city){
const response=await fetch(apiUrl +city+ `&appid=${apiKey}&units=metric`);

if(response.status==404){
    document.querySelector(".error").style.display="block"
    document.querySelector(".weather").style.display="none"
}
else {

var data=await response.json(); 
console.log(data);
let tempf=data.main.temp
//let tempf=
document.querySelector(".city").innerHTML=data.name;
document.querySelector(".temp").innerHTML=data.main.temp+"°C";
document.querySelector(".humidity").innerHTML=data.main.humidity+" %"
document.querySelector(".wind").innerHTML=data.wind.speed+" Km/h"

if(data.weather[0].main=="Clouds"){
    weatherIcon.src="https://img.icons8.com/?size=100&id=117004&format=png&color=000000"
}
else if(data.weather[0].main=="Clear"){
    weatherIcon.src="https://img.icons8.com/?size=100&id=qA3w9Yp2vY7r&format=png&color=000000"
}
else if(data.weather[0].main=="Rain"){
    weatherIcon.src="https://img.icons8.com/?size=100&id=64197&format=png&color=000000"
}
else if(data.weather[0].main=="Drizzle"){
    weatherIcon.src="https://img.icons8.com/?size=100&id=zL5269JCfNc1&format=png&color=000000"
}
else if(data.weather[0].main=="Mist"){
    weatherIcon.src="https://img.icons8.com/?size=100&id=jKuLdYb5eHoA&format=png&color=000000"
}

document.querySelector(".weather").style.display="block"
document.querySelector(".error").style.display="none"
}

}
searchBtn.addEventListener("click",()=>{
    cheakWeather(searchBox.value);
})

cheakWeather();

  </script>
    
</body>
</html>
